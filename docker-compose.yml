services:
  api-gateway:
    build:
      context: ./services/api-gateway
    ports:
      - "3000:3000"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_SERVICE_URL=http://auth-service:3004
      - CONTENT_SERVICE_URL=http://content-service:3001
      - TRANSLATION_SERVICE_URL=http://translation-service:3002
      - TTS_SERVICE_URL=http://tts-service:3003
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
    depends_on:
      - auth-service
      - content-service
      - translation-service
      - tts-service

  auth-service:
    build:
      context: ./services/auth-service
    ports:
      - "3004:3004"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - MONGODB_URI=mongodb://mongodb:27017/auth_db
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
    depends_on:
      - mongodb

  tts-service:
    build:
      context: ./services/tts-service
    ports:
      - "3003:3003"

  content-service:
    build:
      context: ./services/content-service
    ports:
      - "3001:3001"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - MONGODB_URI=mongodb://mongodb:27017/content_db
      - VNPAY_TMN_CODE=${VNPAY_TMN_CODE:-}
      - VNPAY_HASH_SECRET=${VNPAY_HASH_SECRET:-}
      - VNPAY_RETURN_URL=${VNPAY_RETURN_URL:-http://localhost:3000/payments/vnpay/return}
      - PAYMENT_FRONTEND_RETURN_URL=${PAYMENT_FRONTEND_RETURN_URL:-http://localhost:5173/payment}
      - CHAT_API_URL=${CHAT_API_URL:-https://api.openai.com/v1/chat/completions}
      - CHAT_MODEL=${CHAT_MODEL:-gpt-4o-mini}
      - CHAT_API_KEY=${CHAT_API_KEY:-}
      - AUTH_SERVICE_URL=http://auth-service:3004
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
    depends_on:
      - mongodb
    restart: always

  translation-service:
    build:
      context: ./services/translation-service
    ports:
      - "3002:3002"
    environment:
      - TRANSLATION_API_URL=${TRANSLATION_API_URL:-}
      - TRANSLATION_API_KEY=${TRANSLATION_API_KEY:-}
    restart: always

  mongodb:
    image: mongo:8
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - ./database/seed:/seed:ro

volumes:
  mongo_data:
