services:
  api-gateway:
    platform: linux/amd64
    build:
      context: ./services/api-gateway
    ports:
      - "3000:3000"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_SERVICE_URL=http://auth-service:3004
      - CONTENT_SERVICE_URL=http://content-service:3001
      - TRANSLATION_SERVICE_URL=http://translation-service:3002
      - TTS_SERVICE_URL=http://tts-service:3003
    depends_on:
      - auth-service
      - content-service
      - translation-service
      - tts-service

  auth-service:
    platform: linux/amd64
    build:
      context: ./services/auth-service
    ports:
      - "3004:3004"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - MONGODB_URI=mongodb://mongodb:27017/auth_db
    depends_on:
      - mongodb

  tts-service:
    platform: linux/amd64
    build:
      context: ./services/tts-service
    ports:
      - "3003:3003"

  content-service:
    platform: linux/amd64
    build:
      context: ./services/content-service
    ports:
      - "3001:3001"
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - MONGODB_URI=mongodb://mongodb:27017/content_db
      - VNP_TMN_CODE=${VNP_TMN_CODE}
      - VNP_HASH_SECRET=${VNP_HASH_SECRET}
      - VNP_RETURN_URL=${VNP_RETURN_URL:-http://localhost:3001/payments/vnpay-return}
      - VNP_FRONTEND_RETURN_URL=${VNP_FRONTEND_RETURN_URL:-http://localhost:5173/payment-result}
    depends_on:
      - mongodb
    restart: always

  translation-service:
    platform: linux/amd64
    build:
      context: ./services/translation-service
    ports:
      - "3002:3002"
    restart: always

  mongodb:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: