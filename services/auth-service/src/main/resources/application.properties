spring.application.name=auth-service
server.port=3004

# MongoDB
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/auth_db}
spring.data.mongodb.database=auth_db
spring.data.mongodb.auto-index-creation=true

# Tạo Admin ban đầu khi cung cấp hai biến môi trường này
app.bootstrap-admin.username=${ADMIN_USERNAME:}
app.bootstrap-admin.password=${ADMIN_PASSWORD:}