
spring.application.name=content-service
server.port=3001

spring.mongodb.uri=${MONGODB_URI:mongodb://mongodb:27017/content_db}
spring.data.mongodb.database=content_db
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB
app.poi-image-dir=${POI_IMAGE_DIR:./uploads/poi}

payment.vnpay.tmn-code=${VNPAY_TMN_CODE:}
payment.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
payment.vnpay.url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
payment.vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:3000/payments/vnpay/return}

payment.frontend-return-url=${PAYMENT_FRONTEND_RETURN_URL:http://localhost:5173/payment}

chat.api-url=${CHAT_API_URL:https://api.openai.com/v1/chat/completions}
chat.model=${CHAT_MODEL:gpt-4o-mini}
chat.api-key=${CHAT_API_KEY:}
