spring.application.name=content-service
server.port=3001

# MongoDB (dùng chung container với auth-service, database riêng)
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/content_db}
spring.data.mongodb.database=content_db
spring.data.mongodb.auto-index-creation=true

logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG

# --- CẤU HÌNH VNPAY SANDBOX ---
vnp.payUrl=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
# Keep content and cash payments available when VNPay credentials are not set.
vnp.tmnCode=${VNP_TMN_CODE:}
vnp.hashSecret=${VNP_HASH_SECRET:}
vnp.returnUrl=${VNP_RETURN_URL:http://localhost:3001/payments/vnpay-return}
vnp.frontendReturnUrl=${VNP_FRONTEND_RETURN_URL:http://localhost:5173/payment-result}
vnp.apiUrl=https://sandbox.vnpayment.vn/merchant_webapi/api/transaction