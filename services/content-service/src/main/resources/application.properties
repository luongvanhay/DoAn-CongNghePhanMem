spring.application.name=content-service
server.port=3001

# MongoDB (dùng chung container với auth-service, database riêng)
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/content_db}
spring.data.mongodb.database=content_db
spring.data.mongodb.auto-index-creation=true

logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG

payment.vnpay.url=${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
payment.vnpay.tmn-code=${VNPAY_TMN_CODE:}
payment.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
payment.vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:3000/payments/vnpay/return}
payment.frontend-return-url=${PAYMENT_FRONTEND_RETURN_URL:http://localhost:5173/payment}
