
spring.application.name=api-gateway
server.port=3000

# Route API Gateway -> Auth Service
spring.cloud.gateway.server.webmvc.routes[0].id=auth-service
spring.cloud.gateway.server.webmvc.routes[0].uri=${AUTH_SERVICE_URL:http://localhost:3004}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/auth/**

# Route API Gateway -> Content Service
spring.cloud.gateway.server.webmvc.routes[1].id=content-service
spring.cloud.gateway.server.webmvc.routes[1].uri=${CONTENT_SERVICE_URL:http://localhost:3001}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/content/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=1

# Route API Gateway -> Translation Service
spring.cloud.gateway.server.webmvc.routes[2].id=translation-service
spring.cloud.gateway.server.webmvc.routes[2].uri=${TRANSLATION_SERVICE_URL:http://localhost:3002}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/translation/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=StripPrefix=1

# Route API Gateway -> TTS Service
spring.cloud.gateway.server.webmvc.routes[3].id=tts-service
spring.cloud.gateway.server.webmvc.routes[3].uri=${TTS_SERVICE_URL:http://localhost:3003}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/tts/**
spring.cloud.gateway.server.webmvc.routes[3].filters[0]=StripPrefix=1
