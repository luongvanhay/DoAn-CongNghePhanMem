
spring.application.name=api-gateway
server.port=3000

spring.cloud.gateway.server.webmvc.routes[0].id=auth-service
spring.cloud.gateway.server.webmvc.routes[0].uri=${AUTH_SERVICE_URL:http://auth-service:3004}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.server.webmvc.routes[1].id=content-service
spring.cloud.gateway.server.webmvc.routes[1].uri=${CONTENT_SERVICE_URL:http://content-service:3001}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/contents/**

spring.cloud.gateway.server.webmvc.routes[2].id=translation-service
spring.cloud.gateway.server.webmvc.routes[2].uri=${TRANSLATION_SERVICE_URL:http://translation-service:3002}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/translation/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[3].id=tts-service
spring.cloud.gateway.server.webmvc.routes[3].uri=${TTS_SERVICE_URL:http://tts-service:3003}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/tts/**
spring.cloud.gateway.server.webmvc.routes[3].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[4].id=payment-service
spring.cloud.gateway.server.webmvc.routes[4].uri=${CONTENT_SERVICE_URL:http://content-service:3001}
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/payments/**

# API cho trang admin: /api/content/contents, /api/content/visits/...
spring.cloud.gateway.server.webmvc.routes[5].id=content-admin-api
spring.cloud.gateway.server.webmvc.routes[5].uri=${CONTENT_SERVICE_URL:http://content-service:3001}
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/api/content/**
spring.cloud.gateway.server.webmvc.routes[5].filters[0]=StripPrefix=2

# API cho trang quản lý POI: /api/contents/...
spring.cloud.gateway.server.webmvc.routes[6].id=content-poi-api
spring.cloud.gateway.server.webmvc.routes[6].uri=${CONTENT_SERVICE_URL:http://content-service:3001}
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/api/contents/**
spring.cloud.gateway.server.webmvc.routes[6].filters[0]=StripPrefix=1

# API cho chức năng dịch ngôn ngữ
spring.cloud.gateway.server.webmvc.routes[7].id=translation-api
spring.cloud.gateway.server.webmvc.routes[7].uri=${TRANSLATION_SERVICE_URL:http://translation-service:3002}
spring.cloud.gateway.server.webmvc.routes[7].predicates[0]=Path=/api/translation/**
spring.cloud.gateway.server.webmvc.routes[7].filters[0]=StripPrefix=2
